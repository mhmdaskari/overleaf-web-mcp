name: Download count

# Once a week, sums the package's all-time npm downloads and publishes them as a shields.io
# endpoint badge (npm-downloads.json) on the `badges` branch, which the README and the docs read.
# The branch holds a single generated commit that each run replaces, so main never gets a commit
# from this workflow, and the badge stays current on npmjs.com without a new release.
on:
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-count
  cancel-in-progress: false

jobs:
  update:
    name: Update the download badge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # The script has no dependencies and Node 24 runs TypeScript directly, so nothing is
      # installed. It fails, leaving the published badge as it was, rather than publish a partial
      # total.
      - name: Count downloads
        run: |
          mkdir -p "$RUNNER_TEMP/badges"
          node scripts/npm-downloads.ts "$RUNNER_TEMP/badges/npm-downloads.json"

      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/badges
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init --quiet --initial-branch=badges
          if git fetch --quiet --depth=1 "$remote" badges 2>/dev/null &&
            git show FETCH_HEAD:npm-downloads.json 2>/dev/null | cmp --silent - npm-downloads.json; then
            echo "The download badge is unchanged."
            exit 0
          fi
          cat > README.md <<'EOF'
          # badges

          Generated by the `Download count` workflow on `main`; every run replaces this branch's
          only commit. `npm-downloads.json` is a shields.io endpoint badge read by the README and
          the documentation. Do not edit by hand.
          EOF
          git add npm-downloads.json README.md
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message="chore: update the npm download count"
          git push --quiet --force "$remote" HEAD:badges
          echo "Published $(grep '"message"' npm-downloads.json)"
